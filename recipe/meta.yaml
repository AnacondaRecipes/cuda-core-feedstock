{% set name = "cuda-core" %}
{% set version = "1.0.0" %}
{% set number = 0 %}

{% set target_name = "x86_64-linux" %}  # [linux64]
{% set target_name = "sbsa-linux" %}  # [aarch64]
{% set target_name = "x64" %}  # [win64]
{% set subdir = "" %}
{% set subdir = os.sep.join(["", "targets", target_name]) %}  # [linux64 or aarch64]
{% set subdir = os.sep.join(["", "Library"]) %}               # [win64]

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/NVIDIA/cuda-python/releases/download/{{ name }}-v{{ version }}/cuda-python-{{ name }}-v{{ version }}.tar.gz
  sha256: ae7e32ea9d9a067697dcaaea55bbb149e8fb9c9d14acd1d87f7d2206dfc8ce97

build:
  number: {{ number }}
  string: cuda{{ cuda_major_version }}_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  skip: true  # [py<310 or osx]
  script_env:
    - CUDA_PATH={{ PREFIX ~ subdir }}
  missing_dso_whitelist:
    - "*/torch_cpu.dll"      # [win]
    - "*/torch_python.dll"   # [win]
  ignore_run_exports_from:
    - cuda-cudart-dev
    - cuda-nvrtc-dev

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - cython >=3.2,<3.3
    - pip
    - python
    - setuptools >=80
    - setuptools-scm >=8
    - cuda-cudart-dev
    - cuda-nvrtc-dev
    - cuda-profiler-api
    - cuda-bindings {{ cuda_major_version }}.*
    - cuda-version {{ cuda_major_version }}.*
    - cuda-pathfinder >=1.5
  run:
    - python
    - numpy
    - cuda-pathfinder >=1.4.2,<2
    - backports.strenum  # [py<311]
    - {{ pin_compatible("cuda-bindings", min_pin="x", max_pin="x") }}
    - {{ pin_compatible("cuda-version", min_pin="x", max_pin="x") }}

test:
  requires:
    - pip
  imports:
    - cuda.core
    - cuda.core.checkpoint
    - cuda.core.graph
    - cuda.core.typing
    - cuda.core.system
    - cuda.core.utils
  commands:
    - pip check
    - python -c "from cuda.core import __version__; print('cuda-core version:', __version__)"
    - python -c "from cuda.core import Device, Buffer, Kernel, Event; print('ok')"
    - python -c "from cuda.core.graph import Graph, GraphNode, GraphDefinition; print('graph ok')"

about:
  home: https://nvidia.github.io/cuda-python/cuda-core
  license: Apache-2.0
  license_file: cuda_core/LICENSE
  license_url: https://github.com/NVIDIA/cuda-python/blob/main/cuda_core/LICENSE
  license_family: Apache
  summary: "cuda.core: pythonic CUDA module"
  description: |
    cuda.core bridges Python's productivity with CUDA's performance through intuitive and pythonic APIs.
    The mission is to provide users full access to all of the core CUDA features in Python, such as
    runtime control, compiler and linker.
  doc_url: https://nvidia.github.io/cuda-python/cuda-core
  dev_url: https://github.com/NVIDIA/cuda-python

extra:
  skip-lints:
    - deprecate_license_url
  recipe-maintainers:
    - conda-forge/cuda-python
    - bdice
    - leofang
    - kkraus14
